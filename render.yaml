services:
  - type: web
    name: ai-lead-scoring-agent
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REQUIRE_LLM
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: lead-scoring-postgres
          property: connectionString

databases:
  - name: lead-scoring-postgres
    plan: 0.1c-256mb
    databaseName: lead_scoring
    user: lead_scoring
